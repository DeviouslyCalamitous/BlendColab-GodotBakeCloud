[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blendcolab-godotbakecloud"
version = "0.2.0"
description = "Distributed Cloud GPU Render & Lightmap Bake Farm for Blender 3.6-5.3 and Godot 4"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]