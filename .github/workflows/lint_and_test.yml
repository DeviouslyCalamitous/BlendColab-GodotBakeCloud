name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check --select E,F --ignore E402 scripts tests

      - name: Validate Notebook JSON
        run: python -c "import json; json.load(open('notebooks/BlendColab_GodotBake.ipynb', encoding='utf-8'))"

      - name: Run Unit Tests
        run: pytest